name: Programa Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt pyinstaller==6.11.1
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python desktop/build_windows.py
      - name: Testar executável e Chrome em página local
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\RegistroDeAulas.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "O teste do executável falhou: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: RegistroDeAulas-Windows
          path: dist/RegistroDeAulas.exe
          if-no-files-found: error
